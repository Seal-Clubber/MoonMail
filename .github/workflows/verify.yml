name: Verify GhostDrop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.19.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium and system dependencies
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
      - run: pnpm test:browser
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.19.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/ghostdrop -> target
            contracts/envelope -> target
            contracts/engine-tests -> target
      - run: cargo test --manifest-path contracts/ghostdrop/Cargo.toml --locked
      - run: cargo test --manifest-path contracts/envelope/Cargo.toml --locked
      - run: cargo build --manifest-path contracts/envelope/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo build --manifest-path contracts/ghostdrop/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo test --manifest-path contracts/engine-tests/Cargo.toml --locked -- --include-ignored
  postbox-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.19.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/envelope-v2 -> target
            contracts/ghostdrop-v2 -> target
            contracts/postbox-claim-tests -> target
            contracts/ghostdrop-v3 -> target
      - run: cargo test --manifest-path contracts/envelope-v2/Cargo.toml --locked
      - run: cargo build --manifest-path contracts/envelope-v2/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo build --manifest-path contracts/ghostdrop-v2/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo build --manifest-path contracts/ghostdrop-v3/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo test --manifest-path contracts/postbox-claim-tests/Cargo.toml --locked -- --include-ignored
  recovery-capsule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.19.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/recovery-capsule -> target
            contracts/capsule-tests -> target
      - run: cargo build --manifest-path contracts/recovery-capsule/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo test --manifest-path contracts/capsule-tests/Cargo.toml --locked
