name: Verify MoonMail
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.19.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium and system dependencies
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
      - run: pnpm test:browser
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.19.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/legacy/ghostdrop -> target
            contracts/legacy/envelope -> target
            contracts/tests/legacy-mail -> target
      - run: cargo test --manifest-path contracts/legacy/ghostdrop/Cargo.toml --locked
      - run: cargo test --manifest-path contracts/legacy/envelope/Cargo.toml --locked
      - run: cargo build --manifest-path contracts/legacy/envelope/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo build --manifest-path contracts/legacy/ghostdrop/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo test --manifest-path contracts/tests/legacy-mail/Cargo.toml --locked -- --include-ignored
  postbox-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.19.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/legacy/envelope-v2 -> target
            contracts/legacy/ghostdrop-v2 -> target
            contracts/tests/mailbox -> target
            contracts/legacy/ghostdrop-v3 -> target
            contracts/moonmail-v4 -> target
      - run: cargo test --manifest-path contracts/legacy/envelope-v2/Cargo.toml --locked
      - run: cargo build --manifest-path contracts/legacy/envelope-v2/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo build --manifest-path contracts/legacy/ghostdrop-v2/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo build --manifest-path contracts/legacy/ghostdrop-v3/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo build --manifest-path contracts/moonmail-v4/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo test --manifest-path contracts/tests/mailbox/Cargo.toml --locked -- --include-ignored
  recovery-capsule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.19.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/legacy/recovery-capsule -> target
            contracts/tests/recovery -> target
      - run: cargo build --manifest-path contracts/legacy/recovery-capsule/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo test --manifest-path contracts/tests/recovery/Cargo.toml --locked
  moon-pot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.19.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/moonmail-v4 -> target
            contracts/moonmail-pot -> target
            contracts/tests/pot -> target
      - run: cargo build --manifest-path contracts/moonmail-v4/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo build --manifest-path contracts/moonmail-pot/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - run: cargo test --manifest-path contracts/tests/pot/Cargo.toml --locked
