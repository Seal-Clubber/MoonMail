[package]
name = "ghostdrop_envelope_v2"
version = "0.2.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
tari_template_lib = "=0.35.0"
blake2 = "=0.10.6"
bech32 = "=0.11.1"
serde_json = "=1.0.151"
[profile.release]
opt-level = "s"
overflow-checks = true
strip = true
lto = true
panic = "abort"
