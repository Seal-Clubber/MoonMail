[package]
name = "ghostdrop_recovery_capsule"
version = "0.1.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
tari_template_lib = { version = "=0.34.0", features = ["serde"] }
serde_json = "=1.0.151"
[profile.release]
opt-level = "s"
overflow-checks = true
strip = true
lto = true
panic = "abort"
