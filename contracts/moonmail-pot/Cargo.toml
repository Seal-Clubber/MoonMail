[package]
name = "moonmail_pot"
version = "0.1.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
tari_template_lib = { version = "=0.35.0", features = ["serde"] }
blake2 = "=0.10.6"
[profile.release]
opt-level = "s"
overflow-checks = true
strip = true
lto = true
panic = "abort"
