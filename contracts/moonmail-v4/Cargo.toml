[package]
name = "moonmail_v4"
version = "0.4.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
tari_template_lib = { version = "=0.34.0", features = ["serde"] }
blake2 = "=0.10.6"
bech32 = "=0.11.1"
serde_json = "=1.0.151"
[profile.release]
opt-level = "s"
overflow-checks = true
strip = true
lto = true
panic = "abort"
